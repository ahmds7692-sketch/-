<style>

.tst.on{transform:translate(-50%,0)}

body{background:radial-gradient(circle at 10% -5%,color-mix(in srgb,var(--pri) 20%,transparent),transparent 42%),radial-gradient(circle at 100% 8%,color-mix(in srgb,var(--in) 16%,transparent),transparent 38%),var(--bg);background-attachment:fixed}
.top h1{font-size:17px}

.hero{position:relative;overflow:hidden;transition:background .6s}

.card{box-shadow:0 4px 18px rgba(30,41,59,.07)}

.tabs button.on{background:linear-gradient(135deg,var(--pri),#7c3aed);box-shadow:0 4px 12px rgba(79,70,229,.3)}
.fi{background:linear-gradient(135deg,#10b981,#059669)}.fo{background:linear-gradient(135deg,#f43f5e,#e11d48)}
.chips button.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri))}
.fl{display:flex;gap:7px;padding:12px 0 4px}

.arc{transition:all .3s;cursor:pointer}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:7px}

.set em{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px}
.set:nth-of-type(1) em{background:#6366f126}.set:nth-of-type(2) em{background:#f59e0b26}.set:nth-of-type(3) em{background:#10b98126}.set:nth-of-type(4) em{background:#ec489926}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2,#7c3aed))}
.pl{padding:14px 0;border-bottom:1px solid var(--bd);font-size:15px}
.pal{display:flex;gap:12px;margin-top:12px}
.pal i{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.pal i.on{border-color:var(--tx);transform:scale(1.15)}
.bn{background:#f59e0b;color:#fff;border-radius:12px;padding:11px;margin-bottom:12px;font-weight:700;font-size:14px;text-align:center;cursor:pointer}
.set:nth-of-type(5) em{background:#0ea5e926}.set:nth-of-type(6) em{background:#14b8a626}
</style>

<script>

 o:[["🏠","منصرف ثابت"],["🤝","جمعيات"],["🛒","منصرف متغير"],["🛠️","منصرف شغل"],["✨","منصرف إضافي"]]};

 (function f(t){if(el._t!==t0)return;const p=Math.min(1,(t-t0)/500);el.textContent=fmt(p<1?from+(to-from)*(1-Math.pow(1-p,3)):to);if(p<1)requestAnimationFrame(f)})(t0)}
function edit(id){const r=data.find(x=>x.id==id);if(!r)return;open(r.type);eid=r.id;cat=r.cat;
 [...$("cc").children].forEach(x=>x.classList.toggle("on",x.dataset.c==r.cat));
 $("sht").textContent="✏️ تعديل الحركة";$("amt").value=r.amount;$("note").value=r.note||"";$("dt").value=r.date;$("dl").style.display="block"}

function render(){
 const all=data.filter(r=>r.date.startsWith(mo)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const rows=flt=="a"?all:all.filter(r=>r.type==flt);
